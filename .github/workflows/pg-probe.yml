# TEMPORARY: diagnoses the faster-balances functions on PostgreSQL 17. Remove before merging.
name: PG17 probe

on:
  push:
    branches: [faster-balances]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Load test, 500-member organization, with faster balances
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: node scripts/load-test.mjs --small --keep
      - name: Plan of member balances on the 500-member organization
        env:
          PGPASSWORD: postgres
        run: |
          DB=$(psql -h localhost -U postgres -At -c "select datname from pg_database where datname like 'finseka_load_%' limit 1")
          psql -h localhost -U postgres -d "$DB" -X -q <<'SQL' 2>&1 | grep -vE "^\s*$|Buffers|Storage" | head -250
          LOAD 'auto_explain';
          SET auto_explain.log_min_duration = 500;
          SET auto_explain.log_analyze = on;
          SET auto_explain.log_nested_statements = on;
          SET auto_explain.log_level = notice;
          SELECT p.id AS uid FROM profiles p JOIN organizations o ON o.id = p.org_id WHERE o.name = 'Big Church' \gset
          BEGIN;
          SELECT set_config('request.jwt.claim.sub', :'uid', true) AS x \gset
          SET LOCAL ROLE authenticated;
          SELECT count(*) FROM member_balances();
          ROLLBACK;
          SQL
