name: CI

on:
  push:
    branches: [main, improvements]
  pull_request:

jobs:
  app:
    name: Type check, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Placeholder values: the build only needs them to exist. Real ones live in Vercel.
      - run: npm run build
        env:
          VERCEL: "1"
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_SUPABASE_PROJECT_ID: example

  database:
    name: Database migrations and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
